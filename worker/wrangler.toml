# Created: 2026-08-26 09:20 MST (America/Phoenix)
# Upload to the repo as worker/wrangler.toml
# main updated for the undated worker filename. Rename
# tearsheets-worker-2026-08-25-1337.js to tearsheets-worker.js in the same commit,
# or this points at a file that no longer exists.

# FLAG, unresolved: the handoffs record the deployed Worker as "tearsheets".
# This name is "tearsheets-worker". If those differ, `wrangler deploy` creates a
# SECOND Worker under this name with none of the live bindings or secrets, rather
# than updating the one that is running. Left as written. Confirm the real name in
# the Cloudflare dashboard and change this line if it disagrees.
name = "tearsheets-worker"
main = "tearsheets-worker.js"
compatibility_date = "2026-08-01"
# cron intentionally absent until a manual /run survives; then uncomment:
# [triggers]
# crons = ["0 12 * * 1"]

[[d1_databases]]
binding = "DB"
database_name = "tearsheets"
database_id = "fc33d85a-b76e-4285-834d-ee7b44278e3c"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "tearsheets"

[vars]
SHEET_ID = "REPLACE_OR_LEAVE_EMPTY"
# secrets set via dashboard or: wrangler secret put SERPAPI_KEY / ADMIN_TOKEN / SHEETS_SA
