     14:20 header follows.

       Re-classifies every included row from a fresh page read, new or not.
       Use after any change to the verify reader. Asks for confirmation.
     13:10 header follows.
     Supersedes the 2026-09-11 20:10 copy. Three changes:
       1. Hash loop: tries /img/<id>/600.jpg, then /img/<id>/1600.jpg, then
          thumbnail_url. Skip lines name the address that failed instead of
          guessing "hotlink block". 30s timeout per image so one stall cannot
          hang the pass.
       2. "0a. Harvest (dry run)" and "0. Harvest (live)": GET /run, weekly mode,
          engines news,images,web. Live asks for confirmation because it spends
          SerpApi calls (18 per run) and inserts rows. Needs Worker 2026-09-13
          12:50 or later only for the fetch fixes; /run itself is unchanged.
       3. Hash skip lines are counted and summarized at the end of the pass.
     Prior header (2026-09-11 20:10) follows.

     From 19:50: Adds the verify buttons (5a dry, 5 live) and the
     fetch-images button, so the verification loop runs from this page.
     From 19:25 (handoff 4, Finding 10):
       1. Every button shows a status line: running with elapsed seconds, then done
          or the error text. Nothing is swallowed into the console any more.
       2. Buttons disable while a request is in flight, so a slow publish cannot be
          double-clicked (see handoff 4, Finding 7, for why that matters on cluster).
       3. "4a. Publish (dry run)" hits /admin/publish?dry=1 and reports survivor
          counts without writing.
       4. Token persists in sessionStorage for the tab, so a reload does not silently
          send empty headers and 401.
     Upload to the repo as site/review.html.
     Upload to the repo as site/review.html (canonical path, served by exact name).
     tearsheets merge/split review, behind Cloudflare Access on /review*.
     Also the dhash engine: the browser decodes images and computes hashes,
     then POSTs them to the Worker. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review, tearsheets admin</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
  .bar { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .bar button, .bar input { font:inherit; padding:8px 14px; background:var(--card);
    color:var(--ink); border:1px solid var(--edge); }
  .group { border:1px solid var(--edge); margin-bottom:16px; padding:12px; }
  .group .thumbs { display:flex; gap:8px; flex-wrap:wrap; }
  .group img { height:110px; }
  .dist { font-size:12px; color:var(--ink-dim); }
  .warn { color:#e6b34a; }
  #log { font-size:12px; color:var(--ink-dim); white-space:pre-wrap; }
  table.unres { width:100%; border-collapse:collapse; font-size:13px; margin-top:12px; }
  table.unres td { border-top:1px solid var(--edge); padding:6px 8px; vertical-align:top; }
  table.unres img { height:56px; display:block; }
  table.unres a { color:var(--ink); }
  table.unres .st { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#e6b34a; }
  table.unres .st.confirmed { color:#6fcf7a; }
  table.unres .st.other { color:var(--ink-dim); }
  table.unres button { font:inherit; font-size:12px; padding:3px 8px; background:var(--card); color:var(--ink); border:1px solid var(--edge); margin-right:4px; }
  table.unres .detail { font-size:12px; color:var(--ink-dim); white-space:pre-wrap; }
  .unres-bar { display:flex; gap:8px; align-items:center; margin-top:20px; }
  .unres-bar input { font:inherit; padding:6px 10px; background:var(--card); color:var(--ink); border:1px solid var(--edge); }
</style>
</head>
<body>
<header class="site"><h1>Review</h1></header>
<main>
  <div class="bar">
    <input id="token" type="password" placeholder="admin token" size="30">
    <button id="harvestDry">0a. Harvest (dry run)</button>
    <button id="harvestLive">0. Harvest (live, weekly)</button>
    <button id="hash">1. Hash unhashed images</button>
    <button id="clusterDry">2. Cluster (dry run)</button>
    <button id="clusterLive">3. Cluster (live)</button>
    <button id="verifyDry">5a. Verify (dry run, 20 articles)</button>
    <button id="verify">5. Verify (live, 20 articles)</button>
    <button id="verifyAll">5b. Verify all (loops 100 at a time)</button>
    <button id="verifyRedo">5c. Verify all (redo, re-reads every row)</button>
    <button id="fetchImages">6. Fetch images to R2</button>
    <button id="publishDry">4a. Publish (dry run)</button>
    <button id="publish">4. Publish JSON</button>
    <button id="sheets">Sheets sync</button>
    <button id="load">Load frame groups</button>
  </div>
  <div id="status" class="dist" style="margin-bottom:8px"></div>
  <div id="log"></div>
  <div class="unres-bar">
    <button id="loadUnresolved" class="bar-btn">7. Load unresolved</button>
    <input id="unresDomain" placeholder="filter by domain (optional)" size="28">
    <label class="dist"><input type="checkbox" id="unresUnknown" checked> unknown</label>
    <label class="dist"><input type="checkbox" id="unresUnmatched" checked> unmatched</label>
    <label class="dist"><input type="checkbox" id="unresUnreachable"> unreachable</label>
    <span id="unresCount" class="dist"></span>
  </div>
  <div id="unresolved"></div>
  <div id="groups"></div>
</main>
<script type="module">
import { dhashFromImage, hamming } from "/assets/parsers.js";
import { mediaURL } from "/assets/site.js";

const WORKER = "/api"; // route the Worker under /api via its route pattern, or set an absolute URL
const log = (m) => document.getElementById("log").textContent += m + "\n";
const tokenEl = document.getElementById("token");
tokenEl.value = sessionStorage.getItem("tearsheets_token") || "";
tokenEl.oninput = () => sessionStorage.setItem("tearsheets_token", tokenEl.value);
const hdr = () => ({ "x-admin-token": tokenEl.value });

async function api(path, opts = {}) {
  if (!tokenEl.value) throw new Error("admin token is empty");
  const r = await fetch(WORKER + path, { ...opts, headers: { ...hdr(), ...(opts.headers || {}) } });
  const text = await r.text();
  let d; try { d = JSON.parse(text); } catch { d = { raw: text.slice(0, 500) }; }
  if (!r.ok) throw new Error(`${r.status} ${JSON.stringify(d)}`);
  return d;
}

/* Wrap a button handler: status line with elapsed time, all buttons disabled while
   running, errors printed on the page. */
function wire(id, label, fn) {
  const btn = document.getElementById(id);
  const status = document.getElementById("status");
  btn.onclick = async () => {
    const all = [...document.querySelectorAll(".bar button")];
    all.forEach((b) => (b.disabled = true));
    const t0 = Date.now();
    const tick = setInterval(() => {
      status.textContent = `${label}: running, ${Math.round((Date.now() - t0) / 1000)}s`;
    }, 500);
    status.textContent = `${label}: running`;
    try {
      await fn();
      status.textContent = `${label}: done in ${Math.round((Date.now() - t0) / 1000)}s`;
    } catch (e) {
      status.textContent = `${label}: FAILED after ${Math.round((Date.now() - t0) / 1000)}s`;
      log(`ERROR ${label}: ${e.message || e}`);
    } finally {
      clearInterval(tick);
      all.forEach((b) => (b.disabled = false));
    }
  };
}

wire("harvestDry", "harvest dry", async () =>
  log(JSON.stringify(await api("/run?mode=weekly&engines=news,images,web&dry=1"), null, 2)));
wire("harvestLive", "harvest live", async () => {
  if (!confirm("Live harvest: 18 SerpApi calls, inserts new rows, then a 40-row fetch. Continue?")) {
    log("harvest live: cancelled"); return;
  }
  log(JSON.stringify(await api("/run?mode=weekly&engines=news,images,web"), null, 2));
});

wire("hash", "hash", async () => {
  const rows = await api("/admin/unhashed");
  log(`hashing ${rows.length} instances`);
  const out = [];
  let skippedR2 = 0, skippedThird = 0;
  for (const row of rows) {
    // R2-cached images resolve to the media host, which sends the CORS header the
    // canvas read needs. Try the 600 derivative, then 1600 (the two are written
    // together, but one can be missing or undecodable). thumbnail_url is a
    // third-party origin with no CORS header, so those taint and skip; expected.
    const candidates = row.r2_key
      ? [mediaURL(`/img/${row.id}/600.jpg`), mediaURL(`/img/${row.id}/1600.jpg`)]
      : [row.thumbnail_url].filter(Boolean);
    if (!candidates.length) continue;
    let img = null, lastSrc = null;
    for (const src of candidates) {
      lastSrc = src;
      try { img = await loadImage(src); break; } catch {}
    }
    if (!img) {
      if (row.r2_key) { skippedR2++; log(`skip ${row.id}: R2 image failed to load, last tried ${lastSrc}`); }
      else { skippedThird++; }
      continue;
    }
    out.push({ id: row.id, dhash: dhashFromImage(img),
      width: img.naturalWidth, height: img.naturalHeight });
  }
  if (skippedThird) log(`skipped ${skippedThird} rows with no R2 copy (third-party origin, expected until fetched)`);
  if (skippedR2) log(`skipped ${skippedR2} rows WITH an R2 copy that would not load; those need a look`);
  const res = await api("/admin/hashes", { method: "POST",
    headers: { "content-type": "application/json" }, body: JSON.stringify(out) });
  log(`saved ${res.saved} hashes`);
});

wire("clusterDry", "cluster dry", async () =>
  log(JSON.stringify(await api("/admin/cluster?dry=1", { method: "POST" }), null, 2)));
wire("clusterLive", "cluster live", async () =>
  log(JSON.stringify(await api("/admin/cluster", { method: "POST" }), null, 2)));
wire("verifyDry", "verify dry", async () =>
  log(JSON.stringify(await api("/verify?batch=20&dry=1"), null, 2)));
wire("verify", "verify live", async () =>
  log(JSON.stringify(await api("/verify?batch=20"), null, 2)));
async function verifyLoop(label, path) {
  const totals = {}; let articles = 0, calls = 0;
  const status = document.getElementById("status");
  for (;;) {
    if (calls >= 40) { log(`${label}: stopped at 40 calls as a backstop; rerun to continue`); break; }
    const d = await api(path);
    calls++;
    if (!d.articles) { log(`${label}: queue drained after ${calls} calls`); break; }
    articles += d.articles;
    for (const [k, v] of Object.entries(d.by_status || {})) totals[k] = (totals[k] || 0) + v;
    const line = `${label}: ${articles} articles, ` +
      Object.entries(totals).map(([k, v]) => `${k} ${v}`).join(", ");
    status.textContent = line + " (running)";
    log(line);
  }
  log("totals " + JSON.stringify(totals));
}
wire("verifyRedo", "verify redo", async () => {
  if (!confirm("Redo: re-read every included article and rewrite credit_status on all rows. Ten minutes or more. Continue?")) {
    log("verify redo: cancelled"); return;
  }
  const before = encodeURIComponent(new Date().toISOString());
  await verifyLoop("verify redo", `/verify?redo=1&batch=100&before=${before}`);
});
wire("verifyAll", "verify all", async () => {
  const totals = {}; let articles = 0, calls = 0;
  const status = document.getElementById("status");
  for (;;) {
    const d = await api("/verify?batch=100");
    calls++;
    if (!d.articles) { log(`verify all: queue drained after ${calls} calls`); break; }
    articles += d.articles;
    for (const [k, v] of Object.entries(d.by_status || {})) totals[k] = (totals[k] || 0) + v;
    const line = `verify all: ${articles} articles, ` +
      Object.entries(totals).map(([k, v]) => `${k} ${v}`).join(", ");
    status.textContent = line + " (running)";
    log(line);
  }
  log("totals " + JSON.stringify(totals));
});
wire("fetchImages", "fetch images", async () =>
  log(JSON.stringify(await api("/fetch-images?batch=100"), null, 2)));
wire("publishDry", "publish dry", async () =>
  log(JSON.stringify(await api("/admin/publish?dry=1", { method: "POST" }), null, 2)));
wire("publish", "publish", async () =>
  log(JSON.stringify(await api("/admin/publish", { method: "POST" }), null, 2)));
wire("sheets", "sheets sync", async () =>
  log(JSON.stringify(await api("/admin/sheets-sync", { method: "POST" }), null, 2)));

wire("load", "load frames", async () => {
  const frames = await api("/admin/review");
  const el = document.getElementById("groups");
  el.innerHTML = frames.filter((f) => f.members.length > 1 ||
      f.members.some((m) => m.distance > 2)).map((f) => `
    <div class="group">
      <div>frame ${f.frame_id} · ${f.members.length} placements
        ${f.members.some((m) => m.distance >= 3) ? '<span class="warn">near threshold, eyeball this</span>' : ""}</div>
      <div class="thumbs">${f.members.map((m) => `
        <figure style="margin:0">
          <img src="${mediaURL(m.thumb)}" alt="">
          <figcaption class="dist">${m.domain} d=${m.distance ?? "?"}</figcaption>
        </figure>`).join("")}</div>
      <div class="dist">${(f.caption || "").slice(0, 160)}</div>
    </div>`).join("");
  log(`${frames.length} frames loaded, showing multi-member and near-threshold groups`);
});

/* ---- Unresolved table ---- */
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function rowHTML(r) {
  const thumb = r.thumb ? (r.thumb.startsWith("/") ? mediaURL(r.thumb) : r.thumb) : "";
  const title = r.article_title || r.title || r.article_url;
  return `<tr data-id="${r.id}">
    <td>${thumb ? `<img src="${esc(thumb)}" alt="" loading="lazy">` : ""}</td>
    <td>${esc(r.source_domain)}<br><span class="dist">#${r.id}</span></td>
    <td><span class="st ${esc(r.credit_status)}">${esc(r.credit_status)}</span>${r.credit_text ? `<br><span class="dist">${esc(r.credit_text)}</span>` : ""}</td>
    <td><a href="${esc(r.article_url)}" target="_blank" rel="noopener">${esc(String(title).slice(0, 110))}</a></td>
    <td><button data-act="check">Check</button><button data-act="redo">Redo</button></td>
  </tr>
  <tr class="detail-row" data-for="${r.id}" style="display:none"><td></td><td colspan="4" class="detail"></td></tr>`;
}

async function loadUnresolved() {
  const statuses = [];
  if (document.getElementById("unresUnknown").checked) statuses.push("unknown");
  if (document.getElementById("unresUnmatched").checked) statuses.push("unmatched");
  if (document.getElementById("unresUnreachable").checked) statuses.push("unreachable");
  const domain = document.getElementById("unresDomain").value.trim();
  const q = `/admin/unresolved?status=${statuses.join(",")}&limit=500${domain ? `&domain=${encodeURIComponent(domain)}` : ""}`;
  const rows = await api(q);
  document.getElementById("unresCount").textContent = `${rows.length} rows`;
  document.getElementById("unresolved").innerHTML =
    `<table class="unres"><tbody>${rows.map(rowHTML).join("")}</tbody></table>`;
}
document.getElementById("loadUnresolved").onclick = async () => {
  const status = document.getElementById("status");
  try { status.textContent = "load unresolved: running"; await loadUnresolved(); status.textContent = "load unresolved: done"; }
  catch (e) { status.textContent = "load unresolved: FAILED"; log("ERROR load unresolved: " + (e.message || e)); }
};

function describe(d) {
  const det = d.details && d.details[0];
  if (!det) return JSON.stringify(d, null, 2);
  const lines = [`status ${det.status}${det.credit ? ", credit: " + det.credit : ""}${det.note ? "\nnote: " + det.note : ""}`,
    `http ${det.http}  matched: ${det.matched || "none"}`, ""];
  for (const im of det.page_images || []) {
    if (/\.(png|svg|ico)(\?|$)|favicon|icon|logo|\.html?$/i.test(im.url) && im.status === "unknown") continue;
    lines.push(`${im.status.padEnd(9)} ${im.credit || ""}\n          ${im.url}`);
  }
  return lines.join("\n");
}

document.getElementById("unresolved").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-act]"); if (!btn) return;
  const tr = btn.closest("tr"); const id = tr.dataset.id;
  const det = document.querySelector(`tr.detail-row[data-for="${id}"]`);
  const cell = det.querySelector(".detail");
  det.style.display = ""; cell.textContent = btn.dataset.act === "redo" ? "re-reading and writing..." : "reading page...";
  btn.disabled = true;
  try {
    const d = await api(`/verify?id=${id}${btn.dataset.act === "check" ? "&dry=1" : "&redo=1"}`);
    cell.textContent = describe(d);
    if (btn.dataset.act === "redo" && d.details && d.details[0]) {
      const st = tr.querySelector(".st"); st.textContent = d.details[0].status; st.className = "st " + d.details[0].status;
    }
  } catch (e) { cell.textContent = "ERROR " + (e.message || e); }
  finally { btn.disabled = false; }
});

function loadImage(src, timeoutMs = 30000) {
  return new Promise((res, rej) => {
    const i = new Image();
    const t = setTimeout(() => rej(new Error("timeout")), timeoutMs);
    i.crossOrigin = "anonymous";
    i.onload = () => { clearTimeout(t); res(i); };
    i.onerror = () => { clearTimeout(t); rej(new Error("load error")); };
    i.src = src;
  });
}
</script>
</body>
</html>
